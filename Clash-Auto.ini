[custom]
; 基础配置由支持 clash_rule_base 的转换器加载，包含端口、Fake-IP 和分流 DNS。
; SublinkPro 当前 INI 导入会忽略此字段，需另行使用仓库中的基础 YAML。
clash_rule_base=https://raw.githubusercontent.com/lunmare/clash-auto/refs/heads/main/Clash-Base.yaml

; 活跃多源总模板：ACL4SSR 基础分流 + 分类补充；域名清单由各上游维护。
; 更新间隔 86400 秒。保留 ruleset / custom_proxy_group 的 INI 模板结构。
; 广告组默认 DIRECT，需要拦截时在客户端选择 REJECT。

